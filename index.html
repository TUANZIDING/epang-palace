<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'

/* ============================================================================
 * 阿房宫前殿 · 复原假说    依据 brief.md（凡【推测】为设计推断）
 * 单位：米。+X 东，+Z 南，+Y 上；原点 = 台基平面中心，地面 y = 0。
 * 台基：考古 约 1270 × 426 × 12 m，南缘折线（2025：南缘非直线，某处北移约 32 m）
 * 三面夯土墙（考古所见，墙顶铺瓦）；墙厚 15 / 高 3 m【推测】；南坡道 60 × 80 m【推测】
 * 殿庭：东西五百步、南北五十丈 × 秦尺 0.231 m → 693 × 115.5 m（殿庭外轮廓【推测】）
 * 主殿【推测】：23 × 9 间 ≈ 150 × 60 m；二层台 5 m；柱高 6.5 m；庑殿顶约 1:2.4，无鸱尾
 * 五丈旗 ≈ 11.55 m 黑旗（「衣服旄旌节旗皆上黑」）
 * 模式：沿用 machine-skill lab-kit（拆解 / 剖切 / 标注），新增第一人称漫游
 * ==========================================================================*/
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, t) => a + (b - a) * t
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt))
const fmt = (v, d = 0) => Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }

const QIN_CHI = 0.231, BU = 6 * QIN_CHI, ZHANG = 10 * QIN_CHI
const T = { W: 1270, D: 426, H: 12 }
const COURT = { W: 500 * BU, D: 50 * ZHANG, z: -90 }
const HALL = { z: -105, cols: 24, rows: 10, bayX: 6.25, bayZ: 6.0, colH: 6.5, colR: 0.36 }
HALL.w = (HALL.cols - 1) * HALL.bayX; HALL.d = (HALL.rows - 1) * HALL.bayZ
const SEC = { w: 170, d: 76, h: 5 }
const FLOOR = T.H + SEC.h
const BRACKET_H = 1.1
const EAVE_Y = FLOOR + HALL.colH + BRACKET_H
const ROOF = { w: 158, d: 68, rise: 14 }
const BANNER_H = 5 * ZHANG

const canvas = document.getElementById('gl')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.1
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.localClippingEnabled = true
const scene = new THREE.Scene()
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.28
scene.fog = new THREE.Fog(0xc9c4b6, 1400, 11000)
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.3, 20000)
const orbit = new OrbitControls(camera, canvas)
orbit.enableDamping = true; orbit.dampingFactor = 0.07
orbit.maxPolarAngle = Math.PI * 0.495; orbit.minDistance = 8; orbit.maxDistance = 4000

/* 剖切：背面绘红色剖面 + 斜线（仿 lab-kit section caps）；可选三向投影贴图 */
const U = { uCut: { value: 0 } }
const CUT_X = 4.5   // 剖切面：中轴东侧 4.5 m（阁道、御座完整保留，主殿、踏道、坡道被纵剖）
const CUTPLANE = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1e5)
const GLSL_NOISE = `float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float n21(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float fbm2(vec2 p){ float a=.5, v=0.; for(int i=0;i<4;i++){ v+=a*n21(p); p=p*2.07+vec2(3.1,1.7); a*=.5; } return v; }`
function patch(m, { cap = true, tri = null, fx = '' } = {}) {
  m.clippingPlanes = [CUTPLANE]; m.clipShadows = true
  if (cap) m.side = THREE.DoubleSide
  const key = `p${cap ? 1 : 0}${tri ? 1 : 0}${fx.length}_${fx.slice(0, 24)}`
  m.customProgramCacheKey = () => key
  m.onBeforeCompile = (s) => {
    s.uniforms.uCut = U.uCut
    s.vertexShader = s.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP; varying vec3 vWN;')
      .replace('#include <fog_vertex>', `#include <fog_vertex>
      #ifdef USE_INSTANCING
        vWP = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix * instanceMatrix) * objectNormal);
      #else
        vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);
      #endif`)
    let f = s.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uCut; varying vec3 vWP; varying vec3 vWN; uniform sampler2D mapTop; uniform float uS;\n' + GLSL_NOISE)
    if (tri) {
      s.uniforms.mapTop = { value: tri.top }; s.uniforms.uS = { value: tri.s }
      f = f.replace('#include <map_fragment>', `
        vec3 bw = pow(abs(normalize(vWN)), vec3(4.0)); bw /= (bw.x + bw.y + bw.z);
        vec4 tX = texture2D(map, vWP.zy * uS);
        vec4 tZ = texture2D(map, vWP.xy * uS);
        vec4 tY = texture2D(mapTop, vWP.xz * uS);
        diffuseColor *= tX * bw.x + tY * bw.y + tZ * bw.z;`)
    }
    if (fx) f = f.replace('#include <color_fragment>', '#include <color_fragment>\n{ vec3 N_ = normalize(vWN); ' + fx + ' }')
    if (cap) f = f.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      if (uCut > 0.5 && !gl_FrontFacing) {
        float h = step(0.62, fract((gl_FragCoord.x - gl_FragCoord.y) / 9.0));
        gl_FragColor = vec4(mix(vec3(0.62, 0.16, 0.09), vec3(0.40, 0.08, 0.05), h), 1.0);
      }`)
    s.fragmentShader = f
  }
  return m
}

/* 程序化贴图 */
function ctex(w, h, draw, { srgb = true, rep = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  draw(c.getContext('2d'), w, h)
  const t = new THREE.CanvasTexture(c)
  if (srgb) t.colorSpace = THREE.SRGBColorSpace
  if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
function noise(g, w, h, n, a, seed, col = '0,0,0') { const R = rng(seed); for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${col},${R() * a})`; const s = 1 + R() * 2.5; g.fillRect(R() * w, R() * h, s, s) } }
const TEX = {}
// 夯土侧面：8–12 cm 夯层（4 m / 贴图），分块夯筑竖缝
TEX.earthSide = ctex(512, 512, (g, w, h) => {
  const R = rng(7)
  g.fillStyle = '#a77c4c'; g.fillRect(0, 0, w, h)
  let y = 0
  while (y < h) { const lh = 10 + R() * 6, l = 0.82 + R() * 0.3; g.fillStyle = `rgb(${Math.round(168 * l)},${Math.round(124 * l)},${Math.round(78 * l)})`; g.fillRect(0, y, w, lh); g.fillStyle = 'rgba(60,38,18,.28)'; g.fillRect(0, y + lh - 1.3, w, 1.3); y += lh }
  for (const x of [130, 395]) { g.fillStyle = 'rgba(70,45,22,.25)'; g.fillRect(x + R() * 8, 0, 2, h) }
  for (let i = 0; i < 70; i++) { const x = R() * w, y = R() * h, rw = 6 + R() * 26, rh = 2 + R() * 5; g.fillStyle = `rgba(60,38,18,${0.12 + R() * 0.2})`; g.beginPath(); g.ellipse(x, y, rw, rh, 0, 0, 7); g.fill() }
  for (let i = 0; i < 22; i++) { let x = R() * w, y = 0; g.strokeStyle = `rgba(70,46,24,${0.08 + R() * 0.12})`; g.lineWidth = 1 + R() * 2.5; g.beginPath(); g.moveTo(x, y); while (y < h) { y += 6 + R() * 14; x += (R() - 0.5) * 5; g.lineTo(x, y) } g.stroke() }
  noise(g, w, h, 9000, 0.18, 3); noise(g, w, h, 4000, 0.12, 4, '255,240,210')
})
// 夯土顶面：夯窝
TEX.earthTop = ctex(512, 512, (g, w, h) => {
  const R = rng(11)
  g.fillStyle = '#b48a58'; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 260; i++) { const x = R() * w, y = R() * h, r = 3 + R() * 4; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(70,45,20,.35)'); gr.addColorStop(1, 'rgba(70,45,20,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill() }
  noise(g, w, h, 12000, 0.16, 5); noise(g, w, h, 5000, 0.12, 6, '255,240,210')
})
// 方砖铺地（每砖 0.5 m）
// 磨损空心砖 / 夯土铺地：暗黄褐、泥缝、缺角、污渍（非现代干净方砖）
TEX.brick = ctex(512, 512, (g, w, h) => {
  const R = rng(21), n = 4, sz = w / n
  g.fillStyle = '#8a7260'; g.fillRect(0, 0, w, h)
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {

function tileDraw(bump) {
  return (g, w, h) => {
    const R = rng(31), pitch = 64
    g.fillStyle = bump ? '#202020' : '#4d5154'; g.fillRect(0, 0, w, h)
    for (let x = 0; x < w; x += pitch) {
      const gr = g.createLinearGradient(x, 0, x + pitch, 0)
      if (bump) { gr.addColorStop(0, '#606060'); gr.addColorStop(0.5, '#262626'); gr.addColorStop(1, '#606060') }
      else { gr.addColorStop(0, '#5d6265'); gr.addColorStop(0.5, '#43474a'); gr.addColorStop(1, '#5d6265') }
      g.fillStyle = gr; g.fillRect(x, 0, pitch, h)
      const cw = 30, g2 = g.createLinearGradient(x - cw / 2, 0, x + cw / 2, 0)
      if (bump) { g2.addColorStop(0, '#7a7a7a'); g2.addColorStop(0.5, '#ffffff'); g2.addColorStop(1, '#7a7a7a') }
      else { const l = 0.9 + R() * 0.15; g2.addColorStop(0, `rgb(${70 * l},${73 * l},${76 * l})`); g2.addColorStop(0.45, `rgb(${128 * l},${131 * l},${134 * l})`); g2.addColorStop(1, `rgb(${62 * l},${65 * l},${68 * l})`) }
      g.fillStyle = g2; g.fillRect(x - cw / 2, 0, cw, h); if (x === 0) g.fillRect(w - cw / 2, 0, cw, h)
      for (let y = R() * 48; y < h; y += 48) { g.fillStyle = bump ? 'rgba(0,0,0,.7)' : 'rgba(25,26,28,.55)'; g.fillRect(x - cw / 2, y, cw, 2.5); if (x === 0) g.fillRect(w - cw / 2, y, cw, 2.5) }
    }
    if (!bump) noise(g, w, h, 7000, 0.12, 32)
  }
}

const _fw = new THREE.Vector3(), _rt = new THREE.Vector3(), _dir = new THREE.Vector3(), _ax = new THREE.Vector3(), _o = new THREE.Vector3()
function blocked(dir, dist) {

function walkStep(dt) {

      _ax.set(c === 'x' ? Math.sign(comp) : 0, 0, c === 'z' ? Math.sign(comp) : 0)

      const nx = WALK.pos.x + _ax.x * step, nz = WALK.pos.z + _ax.z * step
      if (floorAt(nx, nz, WALK.pos.y + 0.7) <= WALK.pos.y + 0.7) { WALK.pos.x = nx; WALK.pos.z = nz }

layersEl.innerHTML = `<div class="hd">逐层拆解<span>${LAYERS.length} 层</span></div>
<div class="pre"><button data-pre="all">全部</button><button data-pre="struct">仅主体木构</button><button data-pre="base">仅台基</button></div>
<div class="list">${LAYERS.map((L, i) => `<div class="row" data-i="${i}"><span class="dot" style="background:${L.color}"></span><span class="nm" title="仅显示此层">${i + 1}. ${L.name}${L.sub ? `<small style="color:var(--mute)"> ${L.sub}</small>` : ''}</span><span class="ct">${L.count}</span><span class="sw" title="移除 / 复原"></span></div>`).join('')}</div>
<div class="stp"><div class="r"><span>由上而下逐层移除</span><output>0 / ${LAYERS.length}</output></div><input type="range" min="0" max="${LAYERS.length}" step="1" value="0"></div>
<div class="act3"><button data-a="play">▶ 逐层拆解</button><button data-a="explode">全部炸开</button><button data-a="assemble">全部装配</button></div>
<div class="ft"><span class="vis"></span><button data-a="none">全部隐藏</button></div>`
const stepEl = layersEl.querySelector('input')
function setLayers(fn) { LY.playing && clearInterval(LY.playing); LY.playing = null; LAYERS.forEach((L, i) => (L.on = fn(i))); syncLayers() }
function peel(k) { setLayers((i) => i >= k) }  // 移除前 k 层
function syncLayers() {
  layersEl.querySelectorAll('.row').forEach((r) => r.classList.toggle('off', !LAYERS[+r.dataset.i].on))
  const k = LAYERS.findIndex((L) => L.on), removed = k < 0 ? LAYERS.length : LAYERS.slice(0, k).every((L) => !L.on) && LAYERS.slice(k).every((L) => L.on) ? k : -1
  if (removed >= 0) stepEl.value = removed
  layersEl.querySelector('output').textContent = `${removed >= 0 ? removed : '—'} / ${LAYERS.length}`
  const on = LAYERS.filter((L) => L.on)
  layersEl.querySelector('.vis').textContent = `${on.length} 层可见 · ${parts.filter((p) => LAYERS[p.layer].on).length} 组部件`
  const pre = { all: on.length === LAYERS.length, struct: on.length === 5 && LAYERS.slice(0, 5).every((L) => L.on), base: on.length === 1 && LAYERS[8].on }
  layersEl.querySelectorAll('[data-pre]').forEach((b) => b.classList.toggle('on', pre[b.dataset.pre]))
}
function playPeel(ms = 900) {
  if (STATE.walk) setWalk(false)
  TARGET.explode = 0; sync()
  let k = +stepEl.value; if (k >= LAYERS.length - 1) k = 0
  peel(k)
  LY.playing = setInterval(() => { k++; LAYERS.forEach((L, i) => (L.on = i >= k)); syncLayers(); if (k >= LAYERS.length - 1) { clearInterval(LY.playing); LY.playing = null } }, ms)
}
function assembleAll() {
  if (STATE.walk) setWalk(false)
  peel(0); TARGET.explode = 0; TARGET.cut = 0; sync()
  for (const L of LAYERS) L.lift = 1   // 从高空逐层落位（human-atlas 的阻尼回位 + lab-kit 的装配顺序）
  LY.assembleT = 0
}
layersEl.addEventListener('click', (e) => {
  const r = e.target.closest('.row'), b = e.target.closest('button')
  if (STATE.walk && (r || b)) setWalk(false)
  if (r) { const i = +r.dataset.i; if (e.target.classList.contains('nm')) setLayers((j) => j === i); else { LAYERS[i].on = !LAYERS[i].on; syncLayers() } return }
  if (!b) return
  if (b.dataset.pre) return setLayers(b.dataset.pre === 'all' ? () => true : b.dataset.pre === 'struct' ? (i) => i < 5 : (i) => i === 8)
  if (b.dataset.a === 'none') return setLayers(() => false)
  if (b.dataset.a === 'play') return playPeel()
  if (b.dataset.a === 'explode') { peel(0); TARGET.explode = 1; TARGET.cut = 0; sync(); setView('explode', 1.4); return }
  if (b.dataset.a === 'assemble') return assembleAll()
})
stepEl.addEventListener('input', () => peel(+stepEl.value))
syncLayers()
function updateLayers(dt) {
  if (LY.assembleT !== undefined) {   // 全部装配：自下而上逐层落下
    LY.assembleT += dt
    LAYERS.forEach((L, i) => { const t = clamp((LY.assembleT - (LAYERS.length - 1 - i) * 0.35) / 0.9); L.lift = 1 - ease(t) })
    if (LY.assembleT > LAYERS.length * 0.35 + 1) LY.assembleT = undefined
  } else for (const L of LAYERS) L.lift = approach(L.lift, L.on ? 0 : 1, 5.0, dt)
}
const capEl = document.querySelector('.caption span')
function updateCaption() {
  const off = LAYERS.filter((L) => !L.on).length, top = LAYERS.find((L) => L.on)
  capEl.textContent = STATE.explode > 0.95 ? '全部拆解 · 部件陈列' : STATE.explode > 0.05 ? '部件分离中' : LY.assembleT !== undefined ? '逐层装配' : off === 0 ? `完整复原 · ${LAYERS.length} 层` : !top ? '已全部移除' : `已移除 ${off} 层 · 当前顶层：${top.name}`
}
/* ===== 后期：GTAO 环境光遮蔽 → 仅灯焰泛光 → ACES 输出 → 自然调色 ===== */
const QUALITY = new URLSearchParams(location.search).get('q') || 'high'
const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight)
gtao.output = GTAOPass.OUTPUT.Default; gtao.blendIntensity = 0.85
gtao.updateGtaoMaterial({ radius: 1.6, distanceExponent: 1, thickness: 1.2, scale: 1, samples: 12 })
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 })
composer.addPass(gtao)
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.35, 3.2)   // 阈值高于日照白墙，只有灯焰（HDR ×5）溢光
composer.addPass(bloom)
composer.addPass(new OutputPass())
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0.22 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = dot(c, vec3(.2126,.7152,.0722));
      c = mix(vec3(l), c, .94);                                   // 略降饱和，土色自然
      c = c + (c - .5) * .05;                                     // 轻微对比
      c *= mix(vec3(1.02,1.0,.96), vec3(1.), smoothstep(.0,.6,l)); // 暗部微暖
      float v = smoothstep(1.15, .35, length(vUv - .5) * 1.4); c *= mix(1. - uVig, 1., v);
      gl_FragColor = vec4(clamp(c, 0., 1.), 1.); }`,
})
composer.addPass(grade)
function setQuality(q) { gtao.enabled = q !== 'low'; bloom.enabled = q !== 'low'; window.__q = q }
setQuality(QUALITY)
function renderFrame() {
  const d = camera.position.distanceTo(STATE.walk ? WALK.pos : orbit.target)
  gtao.enabled = window.__q !== 'low' && STATE.cut < 0.01 && d < 900   // 剖切时关闭（法线通道不支持剖切面）
  if (gtao.enabled) gtao.updateGtaoMaterial({ radius: STATE.walk ? 1.4 : clamp(d * 0.012, 1.2, 8) })
  for (const m of LODS) m.visible = camera.position.distanceTo(m.getWorldPosition(_lodV)) < m.userData.lod + 160
  composer.render()
}
const _lodV = new THREE.Vector3()

/* ===== 主循环 ===== */
function applyParts() {
  const e = ease(STATE.explode), A = STATE.assembly
  for (const p of parts) {
    const ai = ease(clamp((1 - A) * 1.7 - (p.order / parts.length) * 0.7))
    p.obj.position.copy(p.base).addScaledVector(p.off, e)
    const lf = typeof LAYERS !== 'undefined' ? ease(LAYERS[p.layer].lift) : 0
    if (lf > 0) p.obj.position.y += lf * (220 + p.off.y)
    if (A > 0) p.obj.position.y += (1 - ai) * 400
    p.obj.visible = (ai > 0.002 || A === 0) && lf < 0.985
  }
}
function updateScale() {
  const el = $('.scale'); if (STATE.walk) { el.style.display = 'none'; return } el.style.display = ''
  const d = camera.position.distanceTo(orbit.target), px = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * d)
  let L = 1; for (const n of [1, 2, 5, 10, 20, 50, 100, 200, 500]) if (n * px <= 150) L = n
  el.querySelector('div').style.width = `${(L * px).toFixed(1)}px`; el.querySelector('span').textContent = `${L} m`
}
const promptTxt = '秦阿房宫前殿：若按《史记》规划建成'
let last = performance.now(), t0 = last, time = 0
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; time += dt
  $('.prompt .txt').textContent = promptTxt.slice(0, Math.round(promptTxt.length * clamp((now - t0) / 1400)))
  if (STATE.assembly > 0) STATE.assembly = Math.max(0, 1 - (now - t0 - 400) / 3200)
  for (const k of ['explode', 'cut', 'labels']) STATE[k] = approach(STATE[k], TARGET[k], 4.0, dt)
  updateLayers(dt); applyParts(); updateCaption()
  U.uCut.value = STATE.cut > 0.002 ? 1 : 0
  CUTPLANE.constant = STATE.cut > 0.002 ? lerp(760, CUT_X, ease(STATE.cut)) : 1e5
  for (const f of FLAGS) { const a = f.geometry.attributes.position, b = f.userData.base; for (let i = 0; i < a.count; i++) { const x = b[i * 3], y = b[i * 3 + 1]; a.array[i * 3 + 2] = Math.sin(time * 2.4 + x * 1.6 + y * 0.5 + f.userData.ph) * (f.userData.amp ?? 0.3) * (x / 2.6) } a.needsUpdate = true; f.geometry.computeVertexNormals() }
  if (STATE.walk) walkStep(dt)
  else {
    if (tween) { tween.t += dt; const k = ease(clamp(tween.t / tween.dur)); camera.position.lerpVectors(tween.p0, tween.p1, k); orbit.target.lerpVectors(tween.t0, tween.t1, k); if (k >= 1) tween = null }
    orbit.update(); frameShadowToView()
  }
  hero(); updateLabels(); updateScale()
  renderFrame()
  requestAnimationFrame(frame)
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix() })
setHour(9.5)
requestAnimationFrame(frame)

// 自动化 / 截图钩子（同 lab-kit 的 window.__lab）
window.__app = {
  THREE, scene, camera, renderer, parts, STATE, TARGET, WALK, VIEWS, FLOORS, WALLS,
  setView, toggle, setHour, walkTo, setWalk, setQuality, composer, LAYERS, peel, setLayers, playPeel, assembleAll,
  settleLayers() { for (const L of LAYERS) L.lift = L.on ? 0 : 1; LY.assembleT = undefined; applyParts(); scene.updateMatrixWorld(true) },
  assembleAt(t) { assembleAll(); LY.assembleT = t; updateLayers(0); applyParts() },
  cine(on = true, fov = 30) { document.documentElement.classList.toggle('cine', on); orbit.maxPolarAngle = on ? Math.PI * 0.64 : Math.PI * 0.495; sky.material.uniforms.drama.value = on ? 1 : 0; camera.fov = on ? fov : 38; camera.updateProjectionMatrix() },
  skipIntro() { STATE.assembly = 0; applyParts() },
  snap(o = {}) { for (const k of ['explode', 'cut', 'labels']) if (o[k] !== undefined) { TARGET[k] = o[k]; STATE[k] = o[k] } applyParts(); sync() },
  info() { let tris = 0, meshes = 0; scene.traverse((m) => { if (m.isMesh) { meshes++; const g = m.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 * (m.isInstancedMesh ? m.count : 1) } }); return { meshes, tris: Math.round(tris), calls: renderer.info.render.calls, parts: parts.length } },
  /** 固定步长模拟漫游（不依赖帧率，供无头验证）：keys 如 ['KeyW']，seconds 模拟时长 */
  simWalk(keys = ['KeyW'], seconds = 5, shift = false) {
    const k = {}; for (const c of keys) k[c] = true; if (shift) k.ShiftLeft = true
    const save = WALK.keys; WALK.keys = k
    for (let i = 0; i < seconds * 30; i++) walkStep(1 / 30)
    WALK.keys = save; return this.pos
  },
  get pos() { return WALK.pos.toArray().map((v) => +v.toFixed(2)) },
  ready: true,
}
</script>
</body>
